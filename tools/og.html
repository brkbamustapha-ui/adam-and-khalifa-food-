<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Image de partage</title>
  <style>
    html, body { margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(60% 80% at 76% 50%, rgb(255 106 0 / .35), transparent 70%), #121110; color: #f6efe6; font-family: 'Outfit Variable', sans-serif; position: relative; }
    .logo { position: absolute; right: 90px; top: 50%; width: 400px; height: 400px; border-radius: 50%; transform: translateY(-50%); box-shadow: 0 0 0 12px #fff3e2, 0 40px 90px -20px rgb(255 106 0 / .7); }
    .text { position: absolute; left: 80px; top: 50%; transform: translateY(-50%); width: 600px; }
    .eyebrow { color: #ff7a1a; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; font-size: 22px; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 132px; line-height: .86; margin: 18px 0 20px; }
    h1 span { color: #ff7a1a; }
    p { font-size: 28px; color: #cbbfb2; margin: 0; line-height: 1.35; }
    .r { position: absolute; width: 170px; filter: drop-shadow(0 18px 20px rgb(0 0 0 / .5)); }
    .band { position: absolute; left: -20px; right: -20px; bottom: 38px; height: 12px; background: #ff7a1a; transform: rotate(-1.5deg); }
  </style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">Fast food · Bir El Djir, Oran</div>
    <h1>Adam & Khalifa<br /><span>Food</span></h1>
    <p>Pizzas, sandwichs, tacos, riz crousty et jus AK Juice. Commande sur WhatsApp.</p>
  </div>
  <img class="logo" src="../src/assets/logo-1024.webp" alt="" />
  <img class="r" style="right: 420px; top: 40px; width: 150px" src="../src/assets/renders/slice.webp" alt="" />
  <img class="r" style="right: 30px; bottom: 60px; width: 150px" src="../src/assets/renders/fries.webp" alt="" />
  <img class="r" style="right: 420px; bottom: 50px; width: 150px" src="../src/assets/renders/bowl.webp" alt="" />
  <div class="band"></div>
  <script type="module">
    import '@fontsource/bebas-neue/latin-400.css'
    import '@fontsource-variable/outfit/wght.css'
    await document.fonts.ready
    await Promise.all([...document.images].map((i) => i.decode().catch(() => {})))
    window.__ready = true
  </script>
</body>
</html>
